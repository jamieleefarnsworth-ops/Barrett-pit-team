<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05080e"><meta name="description" content="Barrett Racing tire pressure dashboard"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Barrett Racing</title></head>
<body><main class="app"><header><div class="flag" aria-hidden="true">▰ ▱ ▰ ▱</div><div><h1>BARRETT <span>RACING</span></h1><p>CAR #10 · TIRE PRESSURES</p></div><div class="flag right" aria-hidden="true">▰ ▱ ▰ ▱</div></header>
<section class="panel side-panel" aria-label="Car side view"><h2>SIDE VIEW</h2><img src="./assets/side.png" alt="Blue number 10 race car side view"></section>
<section class="panel pressure-panel"><div class="panel-heading"><h2>TIRE PRESSURES</h2><span class="unit">PSI</span></div><div class="car-area"><img class="top-car" src="./assets/top.png" alt="Top view of blue number 10 race car, front to left"/><label class="pressure lf"><span>LF · LEFT FRONT</span><input data-tire="lf" aria-label="Left front tire PSI" type="number" min="0" max="150" step="0.1" inputmode="decimal" placeholder="—"><small>PSI</small></label><label class="pressure rf"><span>RF · RIGHT FRONT</span><input data-tire="rf" aria-label="Right front tire PSI" type="number" min="0" max="150" step="0.1" inputmode="decimal" placeholder="—"><small>PSI</small></label><label class="pressure lr"><span>LR · LEFT REAR</span><input data-tire="lr" aria-label="Left rear tire PSI" type="number" min="0" max="150" step="0.1" inputmode="decimal" placeholder="—"><small>PSI</small></label><label class="pressure rr"><span>RR · RIGHT REAR</span><input data-tire="rr" aria-label="Right rear tire PSI" type="number" min="0" max="150" step="0.1" inputmode="decimal" placeholder="—"><small>PSI</small></label></div><p class="direction">FRONT OF CAR <span>←</span></p><div class="actions"><button id="save" type="button">SAVE PRESSURES</button><button id="clear" class="secondary" type="button">CLEAR</button></div><p id="status" role="status" aria-live="polite">Values save automatically on this device.</p></section><footer>BARRETT RACING <span>v0.1.0</span></footer></main><script src="./app.js" defer></script></body></html>
